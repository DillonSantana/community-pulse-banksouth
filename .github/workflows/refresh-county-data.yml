# Daily refresh of the county meeting data that feeds the hub's "Where to be" calendar.
#
# Runs county-scraper against all configured county websites, then commits
# data/county-events.js when the meetings changed. The Lead Finder handoff JSONL,
# the digest and the CSV are attached to each run as a downloadable artifact.
#
# Setup (repo admin): add a repository secret COUNTY_SCRAPER_CONTACT with the email
# county IT staff can use to reach us. It goes in the scraper's user agent, as
# scraper_handoff.md asks. The job still runs without it, with a warning.
name: Refresh county data

on:
  schedule:
    - cron: "15 10 * * *"   # daily, 6:15 AM Eastern in summer / 5:15 AM in winter
  workflow_dispatch:        # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-county-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: county-scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: county-scraper/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests

      # The scraper's SQLite memory: which items and documents it has seen, with
      # their hashes and ETags. Keeping it means "new" really means new, and
      # unchanged files aren't downloaded again.
      - name: Restore scraper memory
        uses: actions/cache/restore@v4
        with:
          path: county-scraper/data/items.db
          key: scraper-db-${{ github.run_id }}
          restore-keys: scraper-db-

      - name: Scrape county websites
        env:
          COUNTY_SCRAPER_CONTACT: ${{ secrets.COUNTY_SCRAPER_CONTACT }}
        run: python -m scraper run

      - name: Save scraper memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: county-scraper/data/items.db
          key: scraper-db-${{ github.run_id }}

      - name: Attach Lead Finder handoff, digest and CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: county-scrape-${{ github.run_number }}
          path: |
            county-scraper/out/scrape_*.jsonl
            county-scraper/out/digest_*.md
            county-scraper/out/county_items_*.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Commit calendar data if meetings changed
        working-directory: .
        run: |
          # Ignore the generated-at timestamp lines; commit only real changes.
          if git diff --quiet -I 'generated 20[0-9][0-9]-|COUNTY_EVENTS_GENERATED' -- data/county-events.js; then
            echo "No meeting changes today."
            git checkout -- data/county-events.js
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/county-events.js
          git commit -m "Refresh county meetings for the hub calendar ($(date -u +%Y-%m-%d))"
          # Someone may have merged to main while the scrape ran.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
