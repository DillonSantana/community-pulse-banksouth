# Checks on every pull request into main.
#
# 1. "Nothing dropped": catches a merge-conflict resolution that silently deletes
#    another PR's page, feature, element or function from index.html.
# 2. County scraper tests, when the PR touches county-scraper/.
name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  nothing-dropped:
    name: Nothing dropped from main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare with the base branch
        run: python .github/scripts/check_dropped_features.py "origin/${{ github.base_ref }}"

  scraper-tests:
    name: County scraper tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did this PR touch the scraper?
        id: changed
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^county-scraper/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.changed.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: county-scraper/requirements.txt
      - name: Run tests
        if: steps.changed.outputs.run == 'true'
        working-directory: county-scraper
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests
